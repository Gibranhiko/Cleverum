version: 2
updates:
  # Monorepo npm (root + workspaces frontend/chatbot via el lockfile del root)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Agrupa patches/minors en un solo PR para no inundar de PRs sueltos.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
